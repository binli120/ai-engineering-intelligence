site_name: AI Engineering Intelligence
site_description: Curated AI coding, agents, MCP, tutorials, and production engineering
theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: indigo
      accent: teal
  features:
    - navigation.instant
    - navigation.top
    - search.suggest
    - content.code.copy
extra_css:
  - assets/learning-tools.css
extra_javascript:
  - assets/learning-tools.js
nav:
  - Home: index.md
  - Start Here: start-here.md
  - Agent Engineering:
      - Overview: agents/index.md
      - Framework comparison: agents/framework-comparison.md
      - Responses API: agents/responses-api.md
      - OpenAI Agents SDK: agents/openai-agents-sdk.md
      - LangGraph: agents/langgraph.md
  - MCP: mcp/index.md
  - AI Coding:
      - Overview: coding/index.md
      - Codex: coding/codex.md
      - Cursor: coding/cursor.md
      - Claude Code: coding/claude-code.md
      - AI Skills: coding/ai-skills.md
  - Learning Tools: learning-tools/index.md
  - Production AI:
      - RAG: production/rag.md
      - Evaluation: production/evaluation.md
      - Observability: production/observability.md
      - Security: production/security.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Agent Tool Calling: tutorials/agent-tool-calling.md
      - RAG Evaluation: tutorials/rag-evaluation.md
      - Coding Agent Workflow: tutorials/coding-agent-workflow.md
  - Weekly Updates: weekly/index.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
