[project]
name = "ai-engineering-intelligence"
version = "0.1.0"
description = "Curated AI coding and agent engineering knowledge system"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
authors = [
  { name = "AI Engineering Intelligence Contributors" },
]
keywords = ["ai", "agents", "knowledge-base", "mkdocs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "feedparser>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
  "pydantic>=2.8,<3.0",
  "python-dateutil>=2.9,<3.0",
  "pyyaml>=6.0,<7.0",
  "rich>=13.7,<14.0",
  "typer>=0.12,<1.0",
]

[project.scripts]
aikb = "aikb.cli:app"

[tool.poetry]
packages = [
  { include = "aikb", from = "src" },
]
include = [
  { path = "src/aikb/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.7,<10.0"
mypy = ">=1.10,<2.0"
pre-commit = ">=3.7,<5.0"
pytest = ">=8.2,<9.0"
ruff = ">=0.5,<1.0"
types-PyYAML = ">=6.0,<7.0"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "RUF",
  "UP",
  "W",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
